[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iocloud-sdk"
version = "0.4.0"
description = "Python SDK for managing IOCloud partner spaces"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# Only partners that federate users need to sign OIDC tokens locally.
federation = [
  "cryptography>=42",
  "PyJWT>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/IbaaIbrahim/iocloud-sdk"
Repository = "https://github.com/IbaaIbrahim/iocloud-sdk/tree/main/packages/python"
Issues = "https://github.com/IbaaIbrahim/iocloud-sdk/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
