name: SDK CI

on:
  push:
    paths:
      - "packages/**"
      - "examples/**"
      - "contracts/**"
      - "openapi/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "packages/**"
      - "examples/**"
      - "contracts/**"
      - "openapi/**"
      - ".github/workflows/ci.yml"

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      # The federation extra carries the signing dependencies its tests need.
      - run: python -m pip install -e ".[federation]"
      - run: python -m unittest discover -s tests
      - run: python -m build

  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run

  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/laravel
    strategy:
      fail-fast: false
      matrix:
        # 8.2 is the floor: orchestra/testbench requires it, and the package uses
        # readonly classes.
        php-version: ["8.2", "8.4"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: openssl
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test

  # Integration coverage: the demo consumes the Laravel package from a path
  # repository and verifies SDK-signed tokens against the SDK-served JWKS.
  laravel-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/laravel-demo
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: openssl
          coverage: none
      # Not --strict: consuming the SDK from a path repository needs an "@dev"
      # constraint, which --strict rejects as unbound. The package itself, which is
      # the published artifact, is validated strictly in the job above.
      - run: composer validate --no-check-publish
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit
