openapi: 3.1.0
info:
  title: IOCloud Partner and Tenant API
  version: 1.0.0
  description: Canonical contract used by the IOCloud SDK implementations.
servers:
  - url: https://api.example.com
paths:
  /v1/partner/auth/token:
    post:
      operationId: issuePartnerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentials'
      responses:
        '200':
          description: Partner token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /v1/partner/applications/{application_uuid}/tenants:
    post:
      operationId: createTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '200':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '409':
          description: >-
            Another tenant of the application already holds the external_id
            (TENANT_EXTERNAL_ID_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/federation/providers:
    post:
      operationId: createIdentityProvider
      summary: Register the partner's own OIDC issuer as a trusted provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityProviderRequest'
      responses:
        '201':
          description: Identity provider registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: >-
            The application does not exist or is not the partner's
            (APPLICATION_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The issuer is already registered as a trusted provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The request is invalid (VALIDATION_ERROR), for example
            allow_jit_tenants true with allow_jit_users false: the users of a
            tenant created at login can only be created at login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
    get:
      operationId: listIdentityProviders
      summary: List the identity providers registered by the partner.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity providers listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/tenants/{tenant_uuid}/credentials:
    post:
      operationId: createTenantCredentials
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Tenant credentials created. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCredentialResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/tenants/{tenant_uuid}/external-id:
    patch:
      operationId: setTenantExternalId
      summary: Set, change or clear the id the partner's tokens carry for a tenant.
      description: >-
        A federated login resolves the subject token's tenant claim to the
        tenant of the identity provider's application whose external_id equals
        it. The id is unique within the application, and every provider of
        that application must sign the same one. The key is required: null
        clears it, which stops federated logins into the tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTenantExternalIdRequest'
      responses:
        '200':
          description: External id updated (TENANT_EXTERNAL_ID_UPDATED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          description: The tenant is not the partner's (TENANT_NOT_OWNED_BY_PARTNER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such tenant (TENANT_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            Another tenant of the same application already holds the id
            (TENANT_EXTERNAL_ID_TAKEN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/plans/tenant:
    get:
      operationId: listTenantPlans
      summary: List the tenant plans this partner offers.
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Tenant plans listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPlanListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/plans/tenant/subscriptions:
    get:
      operationId: listTenantSubscriptions
      summary: List every subscription held by this partner's tenants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscriptions listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSubscriptionListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: subscribeTenant
      summary: Put one of the partner's tenants on one of the partner's plans.
      description: >-
        Tenants are the partner's clients and never pay this platform, so the
        partner owns both halves of the flow. With activate_now the subscription
        is created AND activated in one call: the billing window opens and the
        tenant's balance is provisioned as quota.child_caps rows — the tenant's
        own cap from the plan's credits, plus one per active user from
        user_credits_cap.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeTenantRequest'
      responses:
        '201':
          description: Subscription created (and activated when requested).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSubscriptionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: The tenant or the plan was not found for this partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/plans/tenant/subscriptions/{subscription_uuid}/activate:
    post:
      operationId: activateTenantSubscription
      summary: Mark a tenant subscription paid and provision its balance.
      description: >-
        The fallback for money collected outside this platform: the partner
        billed its client in its own system. Runs the same activation path a
        gateway-verified payment would. Idempotent — activating an
        already-active subscription returns it with provisioning null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubscriptionUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualActivationRequest'
      responses:
        '200':
          description: Subscription activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSubscriptionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: No such subscription for one of this partner's tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/topup-packages:
    get:
      operationId: listTopupPackages
      summary: List the top-up packages this partner offers its tenants.
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Packages listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPackageListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createTopupPackage
      summary: Create a credit bundle this partner's tenants can buy.
      description: >-
        The definer and the audience are taken from the authenticated partner,
        never from the body: a partner sells top-ups to its own tenants.
        plan_uuids names the partner's own tenant plans and is what lets two
        plans carry different offers — a package scoped to Bronze is invisible
        to a tenant on Silver. An empty list offers it to every tenant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopupPackageRequest'
      responses:
        '201':
          description: Package created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPackageResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: One of the named plans is not one of this partner's tenant plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/topup-packages/{package_uuid}:
    patch:
      operationId: updateTopupPackage
      summary: Update one of this partner's own top-up packages.
      description: >-
        Omitted fields are left unchanged. Editing changes what the package
        sells next, never what it already sold: existing purchases keep the
        credits snapshotted at purchase time. Omitting plan_uuids keeps the
        current scoping; an empty array clears it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackageUuid'
      responses:
        '200':
          description: Package updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPackageResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: No such package for this partner, or an unknown plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopupPackageRequest'
  /v1/partner/topups/tenant/purchases:
    get:
      operationId: listTenantTopups
      summary: List every top-up bought by one of this partner's tenants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Purchases listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPurchaseListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: grantTenantTopup
      summary: Sell one of this partner's tenants a top-up.
      description: >-
        Tenants are the partner's clients and never pay this platform, so the
        partner owns both halves. With activate_now the credits are spendable
        immediately — a quota.credit_pools row of type topup owned by the
        tenant, spent before the partner's own balance. The package must be one
        that tenant is actually offered, so a plan-scoped package cannot be
        granted to a tenant on the wrong plan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantTenantTopupRequest'
      responses:
        '201':
          description: Purchase created (and activated when requested).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTopupResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: The tenant or the package was not found for this partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/topups/tenant/purchases/{transaction_uuid}/activate:
    post:
      operationId: activateTenantTopup
      summary: Mark a tenant top-up paid and provision its credit pool.
      description: >-
        The fallback for money collected outside this platform: the partner
        billed its client in its own system. Runs the same activation path a
        gateway-verified payment would, leaving payment_transaction_uuid null.
        Idempotent — activating an already-active purchase returns it with
        provisioning null, so a retry never grants the credits twice.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TopupTransactionUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualActivationRequest'
      responses:
        '200':
          description: Purchase activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTopupResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: No such purchase for one of this partner's tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/federation/token:
    post:
      operationId: exchangeSubjectToken
      summary: Exchange a partner-signed OIDC JWT for a platform user session.
      description: >-
        RFC 8693 token exchange. Deliberately unauthenticated: the subject token
        is the credential. Request and response use the OAuth wire format, not
        the platform envelope. On a provider with allow_jit_tenants, a token
        whose tenant claim names no tenant of the provider's application
        creates that tenant from its tenant_profile claim (TenantProfileClaim),
        on the tenant plan its plan_code names if it names one, then the user
        just in time.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Platform session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: >-
            The subject token or the request grammar was rejected.
            invalid_grant covers a token that fails validation, including a
            malformed tenant_profile claim when the exchange needs it to create
            the tenant. invalid_target means no tenant of the provider's
            application has the tenant claim as its external_id and this login
            may not create one, that tenant is not active, the tenant_profile's
            plan_code names none of the partner's tenant plans ("The token's
            tenant plan does not exist.", and nothing is created), or, rarely,
            the tenant could not be created ("The token's tenant could not be
            created.").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeError'
  /v1/tenant/auth/token:
    post:
      operationId: issueTenantToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentials'
      responses:
        '200':
          description: Tenant token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /v1/tenant/users:
    post:
      operationId: createUser
      summary: Create a user inside the authenticated tenant.
      description: >-
        Authenticated with a tenant token, not a partner token. external_id is
        the partner's own id for the person — the value its subject tokens
        carry in the user claim — and is how a federated login finds the user
        within the token's tenant, never by email. Pre-create users this way
        when the identity provider does not provision them just in time
        (allow_jit_users false). The user starts pending and cannot log in
        until it is activated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created, pending until activated (USER_CREATED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '409':
          description: >-
            Another user of the tenant already holds the external_id
            (USER_EXTERNAL_ID_TAKEN), or the user conflicts otherwise, for
            example on its email (USER_INTEGRITY_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/tenant/users/{user_uuid}/status:
    patch:
      operationId: updateUserStatus
      summary: Activate or deactivate a user of the authenticated tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
      responses:
        '200':
          description: Status updated (USER_STATUS_UPDATED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '403':
          description: The user belongs to another tenant (USER_NOT_IN_TENANT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such user (USER_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/tenant/users/{user_uuid}/persona:
    patch:
      operationId: setUserPersona
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              properties:
                persona:
                  type: string
      responses:
        '200':
          description: Persona updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApplicationUuid:
      name: application_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantUuid:
      name: tenant_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionUuid:
      name: subscription_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageUuid:
      name: package_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    TopupTransactionUuid:
      name: transaction_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserUuid:
      name: user_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    AuthenticationError:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiError:
      description: API request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ClientCredentials:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
    Token:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_at: { type: string, format: date-time }
    PartnerTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token]
          properties:
            token: { $ref: '#/components/schemas/Token' }
    TenantTokenResponse:
      $ref: '#/components/schemas/PartnerTokenResponse'
    CreateTenantRequest:
      type: object
      description: >-
        The platform generates the tenant's slug from its name (see
        Tenant.slug) and ignores a slug an older client still sends.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        contact_email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: Optional; omit it for none.
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: >-
            The partner's own id for the organisation: the value its subject
            tokens carry in the tenant claim. Unique within the application;
            omit or null for none.
    Tenant:
      type: object
      required: [uuid, application_uuid, name, slug, contact_email, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        application_uuid: { type: string, format: uuid }
        name: { type: string }
        slug:
          type: string
          description: >-
            Generated by the platform: the name slugified (transliterated to
            lowercase ASCII, hyphen-separated, at most 91 characters cut at a
            word boundary, or "tenant" when the name has no letters or digits),
            a hyphen, then the first 8 hex characters of the tenant's uuid, as
            in acme-corp-5d3c1a7e.
        contact_email:
          type: string
          format: email
          nullable: true
          description: Null for a tenant created without one.
        external_id:
          type: string
          nullable: true
          description: >-
            What a federated login's tenant claim resolves to, within the
            identity provider's application. Null when no federated login
            reaches this tenant.
        status: { type: string }
        created_at: { type: string, format: date-time }
    SetTenantExternalIdRequest:
      type: object
      required: [external_id]
      properties:
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
          description: Required; null clears it.
    TenantResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [tenant]
          properties:
            tenant: { $ref: '#/components/schemas/Tenant' }
    TenantPlan:
      type: object
      required:
        [uuid, name, monthly_price_cents, yearly_price_cents, tpm, rpm, credits,
         user_credits_cap, user_tpm, user_rpm]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        plan_code:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
          description: >-
            The partner's own code for the plan, unique among its tenant plans
            and matched exactly, case included. A just-in-time login names the
            plan its new tenant is created on by it
            (TenantProfileClaim.plan_code). Set in the Admin Dashboard, or with
            POST /v1/partner/plans/tenant and PATCH
            /v1/partner/plans/tenant/{plan_uuid}. Null for a plan without one;
            absent from a platform that predates plan codes, which the SDKs
            read as null.
        monthly_price_cents: { type: integer, minimum: 0 }
        yearly_price_cents: { type: integer, minimum: 0 }
        tpm: { type: integer, minimum: 1 }
        rpm: { type: integer, minimum: 1 }
        credits:
          type: integer
          minimum: 0
          description: The tenant's included balance, provisioned as its child cap.
        user_credits_cap:
          type: integer
          minimum: 0
          description: Per-user share of the balance, one cap row per active user.
        user_tpm: { type: integer, minimum: 1 }
        user_rpm: { type: integer, minimum: 1 }
    TenantPlanListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [list, pagination]
          properties:
            list:
              type: array
              items: { $ref: '#/components/schemas/TenantPlan' }
            pagination: { $ref: '#/components/schemas/Pagination' }
    Pagination:
      type: object
      required: [page, total_pages, limit, total]
      properties:
        page: { type: integer }
        total_pages: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PlanSubscription:
      type: object
      required: [uuid, status, plan_type, billing_cycle, created_at]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [pending_payment, declined, paid] }
        plan_type: { type: string, enum: [partner_plans, tenant_plans] }
        billing_cycle: { type: string, enum: [monthly, yearly] }
        subscribed_from:
          type: string
          format: date-time
          nullable: true
          description: Null while pending; the window opens at activation.
        subscribed_to: { type: string, format: date-time, nullable: true }
        payment_transaction_uuid:
          type: string
          format: uuid
          nullable: true
          description: Null when activated manually — no platform payment exists.
        created_at: { type: string, format: date-time }
    PlanSubscriptionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscriptions]
          properties:
            subscriptions:
              type: array
              items: { $ref: '#/components/schemas/PlanSubscription' }
    ProvisionedBalance:
      type: object
      required: [pool_created, pool_credits, caps_created]
      properties:
        pool_created:
          type: boolean
          description: >-
            False for tenant subscriptions: tenants draw on the partner's pool,
            bounded by their caps, and never own a pool.
        pool_credits: { type: integer, minimum: 0 }
        caps_created:
          type: array
          items:
            type: object
            properties:
              child: { type: string, enum: [tenant, user] }
              id: { type: integer }
              cap: { type: integer, minimum: 0 }
    SubscribeTenantRequest:
      type: object
      required: [tenant_uuid, plan_uuid]
      properties:
        tenant_uuid: { type: string, format: uuid }
        plan_uuid: { type: string, format: uuid }
        billing_cycle: { type: string, enum: [monthly, yearly], default: monthly }
        activate_now:
          type: boolean
          default: false
          description: Create and activate in one call, provisioning the caps.
        reference:
          type: string
          maxLength: 255
          nullable: true
          description: Free text kept in the audit trail (invoice number, note).
    ManualActivationRequest:
      type: object
      properties:
        reference:
          type: string
          maxLength: 255
          nullable: true
    TenantSubscriptionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscription]
          properties:
            subscription: { $ref: '#/components/schemas/PlanSubscription' }
            provisioning:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ProvisionedBalance'
              description: Null when this call provisioned nothing.
    TopupPackagePlan:
      type: object
      required: [plan_type, plan_uuid, plan_name]
      properties:
        plan_type: { type: string, enum: [partner_plans, tenant_plans] }
        plan_uuid: { type: string, format: uuid }
        plan_name: { type: string }
    TopupPackage:
      type: object
      required: [uuid, name, credits, price_cents, status]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        credits:
          type: integer
          minimum: 1
          description: Snapshotted onto each purchase, so later edits never change it.
        price_cents: { type: integer, minimum: 0 }
        validity_days:
          type: integer
          minimum: 1
          nullable: true
          description: Null when the purchased credits never expire.
        definer_type:
          type: string
          nullable: true
          enum: [partners, tenants]
          description: Who sells the package; null for a platform-wide one.
        audience:
          type: string
          nullable: true
          enum: [partners, tenants]
          description: >-
            Who it is for. Null is unrestricted — whoever the definer scope
            reaches. A partner's own packages always read 'tenants'.
        status: { type: string, enum: [active, inactive] }
        plans:
          type: array
          description: >-
            The plans whose subscribers may buy this package. Empty means every
            subscriber, which is what an unscoped package is.
          items: { $ref: '#/components/schemas/TopupPackagePlan' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TopupPackageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [list, pagination]
          properties:
            list:
              type: array
              items: { $ref: '#/components/schemas/TopupPackage' }
            pagination: { $ref: '#/components/schemas/Pagination' }
    TopupPackageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [package]
          properties:
            package: { $ref: '#/components/schemas/TopupPackage' }
    CreateTopupPackageRequest:
      type: object
      required: [name, credits, price_cents]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        credits: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0 }
        validity_days:
          type: integer
          minimum: 1
          nullable: true
          description: Omit for credits that never expire.
        plan_uuids:
          type: array
          default: []
          description: >-
            The partner's own tenant plans whose subscribers may buy this
            package. Empty offers it to all of its tenants.
          items: { type: string, format: uuid }
    UpdateTopupPackageRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        credits: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0 }
        validity_days: { type: integer, minimum: 1, nullable: true }
        status: { type: string, enum: [active, inactive] }
        plan_uuids:
          type: array
          nullable: true
          description: Omit to keep the current scoping; [] to clear it.
          items: { type: string, format: uuid }
    TopupPurchase:
      type: object
      required: [uuid, tenant_uuid, tenant_name, credits, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        tenant_uuid: { type: string, format: uuid }
        tenant_name: { type: string }
        package_uuid: { type: string, format: uuid, nullable: true }
        package_name: { type: string, nullable: true }
        credits:
          type: integer
          minimum: 1
          description: Snapshotted from the package at purchase time.
        valid_from: { type: string, format: date-time, nullable: true }
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Null when the credits never expire.
        status: { type: string, enum: [pending, active, expired] }
        payment_transaction_uuid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Null for a partner-activated purchase: the tenant paid the partner,
            outside this platform, so there is no platform payment to record.
        created_at: { type: string, format: date-time }
    TopupPurchaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [purchases]
          properties:
            purchases:
              type: array
              items: { $ref: '#/components/schemas/TopupPurchase' }
    ProvisionedTopup:
      type: object
      required: [pool_created, pool_credits]
      properties:
        pool_created:
          type: boolean
          description: >-
            True for a tenant top-up: unlike a plan, a top-up gives the tenant a
            credit pool of its own, spent before the partner's balance.
        pool_credits: { type: integer, minimum: 0 }
    GrantTenantTopupRequest:
      type: object
      required: [tenant_uuid, package_uuid]
      properties:
        tenant_uuid: { type: string, format: uuid }
        package_uuid: { type: string, format: uuid }
        activate_now:
          type: boolean
          default: true
          description: Grant and activate in one call, provisioning the pool.
        reference:
          type: string
          maxLength: 255
          nullable: true
          description: Free text kept in the audit trail (invoice number, note).
    TenantTopupResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [purchase]
          properties:
            purchase: { $ref: '#/components/schemas/TopupPurchase' }
            provisioning:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ProvisionedTopup'
              description: Null when this call provisioned nothing.
    CreateIdentityProviderRequest:
      type: object
      required: [application_uuid, name, issuer, jwks_url, allowed_audiences]
      properties:
        application_uuid:
          type: string
          format: uuid
          description: >-
            One of the partner's applications. A token this provider signs
            logs users into that application's tenants only.
        name: { type: string, maxLength: 255 }
        issuer:
          type: string
          maxLength: 500
          description: >-
            Compared byte-for-byte against the subject token's iss claim.
        jwks_url:
          type: string
          maxLength: 500
          description: >-
            The only URL the platform fetches this issuer's signing keys from.
        allowed_audiences:
          type: array
          minItems: 1
          items: { type: string }
        allowed_algorithms:
          type: array
          minItems: 1
          items: { type: string }
          default: [RS256, ES256]
          description: Asymmetric only; HS* and "none" are rejected.
        token_max_age_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 900
        require_email_verified: { type: boolean, default: false }
        user_claim: { type: string, maxLength: 100, default: sub }
        tenant_claim: { type: string, maxLength: 100, default: tenant_id }
        email_claim: { type: string, maxLength: 100, default: email }
        name_claim: { type: string, maxLength: 100, default: name }
        allow_jit_users: { type: boolean, default: false }
        allow_jit_tenants:
          type: boolean
          default: false
          description: >-
            Create the tenant a login's tenant claim names, when the
            application has none, from the token's tenant_profile claim.
            Requires allow_jit_users: true, or the request is a 422.
    IdentityProvider:
      type: object
      required:
        - uuid
        - application_uuid
        - name
        - issuer
        - jwks_url
        - allowed_audiences
        - allowed_algorithms
        - token_max_age_seconds
        - require_email_verified
        - user_claim
        - tenant_claim
        - email_claim
        - name_claim
        - allow_jit_users
        - status
        - created_at
      properties:
        uuid: { type: string, format: uuid }
        application_uuid: { type: string, format: uuid }
        name: { type: string }
        issuer: { type: string }
        jwks_url: { type: string }
        allowed_audiences:
          type: array
          items: { type: string }
        allowed_algorithms:
          type: array
          items: { type: string }
        token_max_age_seconds: { type: integer }
        require_email_verified: { type: boolean }
        user_claim: { type: string }
        tenant_claim: { type: string }
        email_claim: { type: string }
        name_claim: { type: string }
        allow_jit_users: { type: boolean }
        allow_jit_tenants:
          type: boolean
          description: >-
            Absent from a platform that predates just-in-time tenants; the
            SDKs read that as false.
        status: { type: string }
        created_at: { type: string, format: date-time }
    IdentityProviderResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [provider]
          properties:
            provider: { $ref: '#/components/schemas/IdentityProvider' }
    IdentityProviderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [providers]
          properties:
            providers:
              type: array
              items: { $ref: '#/components/schemas/IdentityProvider' }
    CreateUserRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: string, format: email, maxLength: 255 }
        external_id:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            The partner's own id for the person: the value its subject tokens
            carry in the user claim. Unique within the tenant; omit for none.
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, deactivated] }
    User:
      type: object
      required: [uuid, tenant_uuid, name, email, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        tenant_uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        external_id:
          type: string
          nullable: true
          description: >-
            What a federated login's user claim resolves to, within the tenant.
            Null when no federated login reaches this user.
        status:
          type: string
          enum: [pending, active, deactivated]
          description: A user created through the API starts pending.
        created_at: { type: string, format: date-time }
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    TenantCredential:
      type: object
      required: [credential_uuid, tenant_uuid, client_id, client_secret]
      properties:
        credential_uuid: { type: string, format: uuid }
        tenant_uuid: { type: string, format: uuid }
        client_id: { type: string }
        client_secret: { type: string }
    TenantCredentialResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [credential]
          properties:
            credential: { $ref: '#/components/schemas/TenantCredential' }
    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          const: 'urn:ietf:params:oauth:grant-type:token-exchange'
        subject_token:
          type: string
          description: >-
            The OIDC JWT the partner signed with its own private key. Besides
            the claims the provider's claim mapping names (user_claim,
            tenant_claim, email_claim, name_claim), it may carry
            tenant_profile, under that fixed name (TenantProfileClaim).
        subject_token_type:
          type: string
          const: 'urn:ietf:params:oauth:token-type:jwt'
    TenantProfileClaim:
      type: object
      description: >-
        The subject token's optional tenant_profile claim: the tenant a
        just-in-time login creates, with the fields a partner sends to create
        one, plus the plan to create it on (plan_code), which
        CreateTenantRequest does not take. Carried inside the partner-signed
        JWT, never sent to this API as JSON, and never renamed by the
        provider's claim mapping. Read only when the tenant claim names no
        tenant of the provider's application and the provider has
        allow_jit_tenants: the tenant is then created, active, with the tenant
        claim as its external_id and a slug the platform generates from name,
        as it does for CreateTenantRequest (a slug in the claim is ignored).
        It never updates a tenant that exists, so it never changes an existing
        tenant's plan either. When it is needed and malformed, the exchange
        answers invalid_grant.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        contact_email:
          type: string
          minLength: 1
          maxLength: 255
          description: >-
            Optional; omit it for none. One present but not a string of 1 to
            255 characters is malformed.
        plan_code:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Optional: the plan_code of one of the partner's tenant plans
            (TenantPlan.plan_code), matched exactly, case included. The tenant
            is created subscribed to that plan, on a monthly billing cycle and
            activated at once, as subscribeTenant does with activate_now; its
            cap and the cap of the login's user are provisioned from the plan.
            The subscription is written in the same transaction as the tenant,
            so the tenant exists with its plan or not at all. A code that names
            none of the partner's tenant plans refuses the login with
            invalid_target ("The token's tenant plan does not exist.") and
            creates nothing. One present but not a string of 1 to 100
            characters is malformed. Omit it and the tenant has no plan: it
            draws on the partner's credits uncapped until the partner
            subscribes it.
    TokenExchangeResponse:
      type: object
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
        - user_uuid
        - name
        - email
      properties:
        access_token:
          type: string
          description: Opaque platform session token; use as a bearer credential.
        issued_token_type:
          type: string
          const: 'urn:ietf:params:oauth:token-type:access_token'
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        user_uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        tenant_uuid:
          type: string
          format: uuid
          description: >-
            The tenant the session belongs to. Absent from a platform that
            predates just-in-time tenants; the SDKs read that as null.
        tenant_created:
          type: boolean
          description: >-
            True when this exchange created the tenant. Unless its
            tenant_profile named a plan by plan_code, it has no plan yet and
            draws on the partner's credits uncapped until the partner
            subscribes it. Absent from a platform that predates just-in-time
            tenants; the SDKs read that as false.
    TokenExchangeError:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          enum:
            - unsupported_grant_type
            - invalid_request
            - invalid_grant
            - invalid_target
        error_description: { type: string }
    JsonWebKey:
      type: object
      description: >-
        One RSA public signing key. Served by the partner, never by this API;
        the SDK builds this document from the generated federation keypair.
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: { type: string, const: RSA }
        use: { type: string, const: sig }
        alg: { type: string, const: RS256 }
        kid:
          type: string
          description: RFC 7638 JWK thumbprint, so the id is stable per key.
        n: { type: string, description: 'RSA modulus, base64url.' }
        e: { type: string, description: 'RSA public exponent, base64url.' }
    JsonWebKeySet:
      type: object
      description: >-
        The document a partner serves at <issuer>/.well-known/jwks.json, which
        the platform fetches from the provider row's jwks_url.
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/JsonWebKey' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
