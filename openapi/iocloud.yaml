openapi: 3.1.0
info:
  title: IOCloud Partner and Tenant API
  version: 1.0.0
  description: Canonical contract used by the IOCloud SDK implementations.
servers:
  - url: https://api.example.com
paths:
  /v1/partner/auth/token:
    post:
      operationId: issuePartnerToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentials'
      responses:
        '200':
          description: Partner token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /v1/partner/applications/{application_uuid}/tenants:
    post:
      operationId: createTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ApplicationUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '200':
          description: Tenant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/federation/providers:
    post:
      operationId: createIdentityProvider
      summary: Register the partner's own OIDC issuer as a trusted provider.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIdentityProviderRequest'
      responses:
        '201':
          description: Identity provider registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '409':
          description: The issuer is already registered as a trusted provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
    get:
      operationId: listIdentityProviders
      summary: List the identity providers registered by the partner.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Identity providers listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityProviderListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/federation/providers/{provider_uuid}/tenants:
    post:
      operationId: mapExternalTenant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProviderUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapExternalTenantRequest'
      responses:
        '200':
          description: External tenant mapped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalTenantMappingResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/tenants/{tenant_uuid}/credentials:
    post:
      operationId: createTenantCredentials
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Tenant credentials created. The secret is returned once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCredentialResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/plans/tenant:
    get:
      operationId: listTenantPlans
      summary: List the tenant plans this partner offers.
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Tenant plans listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPlanListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/plans/tenant/subscriptions:
    get:
      operationId: listTenantSubscriptions
      summary: List every subscription held by this partner's tenants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Subscriptions listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanSubscriptionListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: subscribeTenant
      summary: Put one of the partner's tenants on one of the partner's plans.
      description: >-
        Tenants are the partner's clients and never pay this platform, so the
        partner owns both halves of the flow. With activate_now the subscription
        is created AND activated in one call: the billing window opens and the
        tenant's balance is provisioned as quota.child_caps rows — the tenant's
        own cap from the plan's credits, plus one per active user from
        user_credits_cap.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeTenantRequest'
      responses:
        '201':
          description: Subscription created (and activated when requested).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSubscriptionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: The tenant or the plan was not found for this partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/plans/tenant/subscriptions/{subscription_uuid}/activate:
    post:
      operationId: activateTenantSubscription
      summary: Mark a tenant subscription paid and provision its balance.
      description: >-
        The fallback for money collected outside this platform: the partner
        billed its client in its own system. Runs the same activation path a
        gateway-verified payment would. Idempotent — activating an
        already-active subscription returns it with provisioning null.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubscriptionUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualActivationRequest'
      responses:
        '200':
          description: Subscription activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSubscriptionResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: No such subscription for one of this partner's tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/topup-packages:
    get:
      operationId: listTopupPackages
      summary: List the top-up packages this partner offers its tenants.
      security:
        - bearerAuth: []
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Packages listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPackageListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createTopupPackage
      summary: Create a credit bundle this partner's tenants can buy.
      description: >-
        The definer and the audience are taken from the authenticated partner,
        never from the body: a partner sells top-ups to its own tenants.
        plan_uuids names the partner's own tenant plans and is what lets two
        plans carry different offers — a package scoped to Bronze is invisible
        to a tenant on Silver. An empty list offers it to every tenant.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTopupPackageRequest'
      responses:
        '201':
          description: Package created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPackageResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: One of the named plans is not one of this partner's tenant plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/topup-packages/{package_uuid}:
    patch:
      operationId: updateTopupPackage
      summary: Update one of this partner's own top-up packages.
      description: >-
        Omitted fields are left unchanged. Editing changes what the package
        sells next, never what it already sold: existing purchases keep the
        credits snapshotted at purchase time. Omitting plan_uuids keeps the
        current scoping; an empty array clears it.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackageUuid'
      responses:
        '200':
          description: Package updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPackageResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: No such package for this partner, or an unknown plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTopupPackageRequest'
  /v1/partner/topups/tenant/purchases:
    get:
      operationId: listTenantTopups
      summary: List every top-up bought by one of this partner's tenants.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Purchases listed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopupPurchaseListResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
    post:
      operationId: grantTenantTopup
      summary: Sell one of this partner's tenants a top-up.
      description: >-
        Tenants are the partner's clients and never pay this platform, so the
        partner owns both halves. With activate_now the credits are spendable
        immediately — a quota.credit_pools row of type topup owned by the
        tenant, spent before the partner's own balance. The package must be one
        that tenant is actually offered, so a plan-scoped package cannot be
        granted to a tenant on the wrong plan.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantTenantTopupRequest'
      responses:
        '201':
          description: Purchase created (and activated when requested).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTopupResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: The tenant or the package was not found for this partner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/partner/topups/tenant/purchases/{transaction_uuid}/activate:
    post:
      operationId: activateTenantTopup
      summary: Mark a tenant top-up paid and provision its credit pool.
      description: >-
        The fallback for money collected outside this platform: the partner
        billed its client in its own system. Runs the same activation path a
        gateway-verified payment would, leaving payment_transaction_uuid null.
        Idempotent — activating an already-active purchase returns it with
        provisioning null, so a retry never grants the credits twice.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TopupTransactionUuid'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualActivationRequest'
      responses:
        '200':
          description: Purchase activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTopupResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          description: No such purchase for one of this partner's tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/ApiError'
  /v1/federation/token:
    post:
      operationId: exchangeSubjectToken
      summary: Exchange a partner-signed OIDC JWT for a platform user session.
      description: >-
        RFC 8693 token exchange. Deliberately unauthenticated: the subject token
        is the credential. Request and response use the OAuth wire format, not
        the platform envelope.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
      responses:
        '200':
          description: Platform session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: The subject token or the request grammar was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeError'
  /v1/tenant/auth/token:
    post:
      operationId: issueTenantToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCredentials'
      responses:
        '200':
          description: Tenant token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationError'
  /v1/tenant/users/{user_uuid}/persona:
    patch:
      operationId: setUserPersona
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              properties:
                persona:
                  type: string
      responses:
        '200':
          description: Persona updated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/AuthenticationError'
        default:
          $ref: '#/components/responses/ApiError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ApplicationUuid:
      name: application_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProviderUuid:
      name: provider_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    TenantUuid:
      name: tenant_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubscriptionUuid:
      name: subscription_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    PackageUuid:
      name: package_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    TopupTransactionUuid:
      name: transaction_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserUuid:
      name: user_uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    AuthenticationError:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiError:
      description: API request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ClientCredentials:
      type: object
      required: [client_id, client_secret]
      properties:
        client_id: { type: string }
        client_secret: { type: string }
    Token:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token: { type: string }
        token_type: { type: string }
        expires_at: { type: string, format: date-time }
    PartnerTokenResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token]
          properties:
            token: { $ref: '#/components/schemas/Token' }
    TenantTokenResponse:
      $ref: '#/components/schemas/PartnerTokenResponse'
    CreateTenantRequest:
      type: object
      required: [name, slug, contact_email]
      properties:
        name: { type: string }
        slug: { type: string }
        contact_email: { type: string, format: email }
    Tenant:
      type: object
      required: [uuid, application_uuid, name, slug, contact_email, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        application_uuid: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        contact_email: { type: string, format: email }
        status: { type: string }
        created_at: { type: string, format: date-time }
    TenantResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [tenant]
          properties:
            tenant: { $ref: '#/components/schemas/Tenant' }
    TenantPlan:
      type: object
      required:
        [uuid, name, monthly_price_cents, yearly_price_cents, tpm, rpm, credits,
         user_credits_cap, user_tpm, user_rpm]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        monthly_price_cents: { type: integer, minimum: 0 }
        yearly_price_cents: { type: integer, minimum: 0 }
        tpm: { type: integer, minimum: 1 }
        rpm: { type: integer, minimum: 1 }
        credits:
          type: integer
          minimum: 0
          description: The tenant's included balance, provisioned as its child cap.
        user_credits_cap:
          type: integer
          minimum: 0
          description: Per-user share of the balance, one cap row per active user.
        user_tpm: { type: integer, minimum: 1 }
        user_rpm: { type: integer, minimum: 1 }
    TenantPlanListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [list, pagination]
          properties:
            list:
              type: array
              items: { $ref: '#/components/schemas/TenantPlan' }
            pagination: { $ref: '#/components/schemas/Pagination' }
    Pagination:
      type: object
      required: [page, total_pages, limit, total]
      properties:
        page: { type: integer }
        total_pages: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    PlanSubscription:
      type: object
      required: [uuid, status, plan_type, billing_cycle, created_at]
      properties:
        uuid: { type: string, format: uuid }
        status: { type: string, enum: [pending_payment, declined, paid] }
        plan_type: { type: string, enum: [partner_plans, tenant_plans] }
        billing_cycle: { type: string, enum: [monthly, yearly] }
        subscribed_from:
          type: string
          format: date-time
          nullable: true
          description: Null while pending; the window opens at activation.
        subscribed_to: { type: string, format: date-time, nullable: true }
        payment_transaction_uuid:
          type: string
          format: uuid
          nullable: true
          description: Null when activated manually — no platform payment exists.
        created_at: { type: string, format: date-time }
    PlanSubscriptionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscriptions]
          properties:
            subscriptions:
              type: array
              items: { $ref: '#/components/schemas/PlanSubscription' }
    ProvisionedBalance:
      type: object
      required: [pool_created, pool_credits, caps_created]
      properties:
        pool_created:
          type: boolean
          description: >-
            False for tenant subscriptions: tenants draw on the partner's pool,
            bounded by their caps, and never own a pool.
        pool_credits: { type: integer, minimum: 0 }
        caps_created:
          type: array
          items:
            type: object
            properties:
              child: { type: string, enum: [tenant, user] }
              id: { type: integer }
              cap: { type: integer, minimum: 0 }
    SubscribeTenantRequest:
      type: object
      required: [tenant_uuid, plan_uuid]
      properties:
        tenant_uuid: { type: string, format: uuid }
        plan_uuid: { type: string, format: uuid }
        billing_cycle: { type: string, enum: [monthly, yearly], default: monthly }
        activate_now:
          type: boolean
          default: false
          description: Create and activate in one call, provisioning the caps.
        reference:
          type: string
          maxLength: 255
          nullable: true
          description: Free text kept in the audit trail (invoice number, note).
    ManualActivationRequest:
      type: object
      properties:
        reference:
          type: string
          maxLength: 255
          nullable: true
    TenantSubscriptionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [subscription]
          properties:
            subscription: { $ref: '#/components/schemas/PlanSubscription' }
            provisioning:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ProvisionedBalance'
              description: Null when this call provisioned nothing.
    TopupPackagePlan:
      type: object
      required: [plan_type, plan_uuid, plan_name]
      properties:
        plan_type: { type: string, enum: [partner_plans, tenant_plans] }
        plan_uuid: { type: string, format: uuid }
        plan_name: { type: string }
    TopupPackage:
      type: object
      required: [uuid, name, credits, price_cents, status]
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string, maxLength: 255 }
        credits:
          type: integer
          minimum: 1
          description: Snapshotted onto each purchase, so later edits never change it.
        price_cents: { type: integer, minimum: 0 }
        validity_days:
          type: integer
          minimum: 1
          nullable: true
          description: Null when the purchased credits never expire.
        definer_type:
          type: string
          nullable: true
          enum: [partners, tenants]
          description: Who sells the package; null for a platform-wide one.
        audience:
          type: string
          nullable: true
          enum: [partners, tenants]
          description: >-
            Who it is for. Null is unrestricted — whoever the definer scope
            reaches. A partner's own packages always read 'tenants'.
        status: { type: string, enum: [active, inactive] }
        plans:
          type: array
          description: >-
            The plans whose subscribers may buy this package. Empty means every
            subscriber, which is what an unscoped package is.
          items: { $ref: '#/components/schemas/TopupPackagePlan' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TopupPackageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [list, pagination]
          properties:
            list:
              type: array
              items: { $ref: '#/components/schemas/TopupPackage' }
            pagination: { $ref: '#/components/schemas/Pagination' }
    TopupPackageResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [package]
          properties:
            package: { $ref: '#/components/schemas/TopupPackage' }
    CreateTopupPackageRequest:
      type: object
      required: [name, credits, price_cents]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        credits: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0 }
        validity_days:
          type: integer
          minimum: 1
          nullable: true
          description: Omit for credits that never expire.
        plan_uuids:
          type: array
          default: []
          description: >-
            The partner's own tenant plans whose subscribers may buy this
            package. Empty offers it to all of its tenants.
          items: { type: string, format: uuid }
    UpdateTopupPackageRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        credits: { type: integer, minimum: 1 }
        price_cents: { type: integer, minimum: 0 }
        validity_days: { type: integer, minimum: 1, nullable: true }
        status: { type: string, enum: [active, inactive] }
        plan_uuids:
          type: array
          nullable: true
          description: Omit to keep the current scoping; [] to clear it.
          items: { type: string, format: uuid }
    TopupPurchase:
      type: object
      required: [uuid, tenant_uuid, tenant_name, credits, status, created_at]
      properties:
        uuid: { type: string, format: uuid }
        tenant_uuid: { type: string, format: uuid }
        tenant_name: { type: string }
        package_uuid: { type: string, format: uuid, nullable: true }
        package_name: { type: string, nullable: true }
        credits:
          type: integer
          minimum: 1
          description: Snapshotted from the package at purchase time.
        valid_from: { type: string, format: date-time, nullable: true }
        valid_to:
          type: string
          format: date-time
          nullable: true
          description: Null when the credits never expire.
        status: { type: string, enum: [pending, active, expired] }
        payment_transaction_uuid:
          type: string
          format: uuid
          nullable: true
          description: >-
            Null for a partner-activated purchase: the tenant paid the partner,
            outside this platform, so there is no platform payment to record.
        created_at: { type: string, format: date-time }
    TopupPurchaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [purchases]
          properties:
            purchases:
              type: array
              items: { $ref: '#/components/schemas/TopupPurchase' }
    ProvisionedTopup:
      type: object
      required: [pool_created, pool_credits]
      properties:
        pool_created:
          type: boolean
          description: >-
            True for a tenant top-up: unlike a plan, a top-up gives the tenant a
            credit pool of its own, spent before the partner's balance.
        pool_credits: { type: integer, minimum: 0 }
    GrantTenantTopupRequest:
      type: object
      required: [tenant_uuid, package_uuid]
      properties:
        tenant_uuid: { type: string, format: uuid }
        package_uuid: { type: string, format: uuid }
        activate_now:
          type: boolean
          default: true
          description: Grant and activate in one call, provisioning the pool.
        reference:
          type: string
          maxLength: 255
          nullable: true
          description: Free text kept in the audit trail (invoice number, note).
    TenantTopupResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [purchase]
          properties:
            purchase: { $ref: '#/components/schemas/TopupPurchase' }
            provisioning:
              nullable: true
              allOf:
                - $ref: '#/components/schemas/ProvisionedTopup'
              description: Null when this call provisioned nothing.
    CreateIdentityProviderRequest:
      type: object
      required: [name, issuer, jwks_url, allowed_audiences]
      properties:
        name: { type: string, maxLength: 255 }
        issuer:
          type: string
          maxLength: 500
          description: >-
            Compared byte-for-byte against the subject token's iss claim.
        jwks_url:
          type: string
          maxLength: 500
          description: >-
            The only URL the platform fetches this issuer's signing keys from.
        allowed_audiences:
          type: array
          minItems: 1
          items: { type: string }
        allowed_algorithms:
          type: array
          minItems: 1
          items: { type: string }
          default: [RS256, ES256]
          description: Asymmetric only; HS* and "none" are rejected.
        token_max_age_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          default: 900
        require_email_verified: { type: boolean, default: false }
        user_claim: { type: string, maxLength: 100, default: sub }
        tenant_claim: { type: string, maxLength: 100, default: tenant_id }
        email_claim: { type: string, maxLength: 100, default: email }
        name_claim: { type: string, maxLength: 100, default: name }
        allow_jit_users: { type: boolean, default: false }
    IdentityProvider:
      type: object
      required:
        - uuid
        - name
        - issuer
        - jwks_url
        - allowed_audiences
        - allowed_algorithms
        - token_max_age_seconds
        - require_email_verified
        - user_claim
        - tenant_claim
        - email_claim
        - name_claim
        - allow_jit_users
        - status
        - created_at
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        issuer: { type: string }
        jwks_url: { type: string }
        allowed_audiences:
          type: array
          items: { type: string }
        allowed_algorithms:
          type: array
          items: { type: string }
        token_max_age_seconds: { type: integer }
        require_email_verified: { type: boolean }
        user_claim: { type: string }
        tenant_claim: { type: string }
        email_claim: { type: string }
        name_claim: { type: string }
        allow_jit_users: { type: boolean }
        status: { type: string }
        created_at: { type: string, format: date-time }
    IdentityProviderResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [provider]
          properties:
            provider: { $ref: '#/components/schemas/IdentityProvider' }
    IdentityProviderListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [providers]
          properties:
            providers:
              type: array
              items: { $ref: '#/components/schemas/IdentityProvider' }
    MapExternalTenantRequest:
      type: object
      required: [tenant_uuid, external_tenant_id]
      properties:
        tenant_uuid: { type: string, format: uuid }
        external_tenant_id: { type: string }
    ExternalTenantMapping:
      type: object
      required: [identity_provider_uuid, tenant_uuid, external_tenant_id, created_at]
      properties:
        identity_provider_uuid: { type: string, format: uuid }
        tenant_uuid: { type: string, format: uuid }
        external_tenant_id: { type: string }
        created_at: { type: string, format: date-time }
    ExternalTenantMappingResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [mapping]
          properties:
            mapping: { $ref: '#/components/schemas/ExternalTenantMapping' }
    TenantCredential:
      type: object
      required: [credential_uuid, tenant_uuid, client_id, client_secret]
      properties:
        credential_uuid: { type: string, format: uuid }
        tenant_uuid: { type: string, format: uuid }
        client_id: { type: string }
        client_secret: { type: string }
    TenantCredentialResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [credential]
          properties:
            credential: { $ref: '#/components/schemas/TenantCredential' }
    TokenExchangeRequest:
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          const: 'urn:ietf:params:oauth:grant-type:token-exchange'
        subject_token:
          type: string
          description: The OIDC JWT the partner signed with its own private key.
        subject_token_type:
          type: string
          const: 'urn:ietf:params:oauth:token-type:jwt'
    TokenExchangeResponse:
      type: object
      required:
        - access_token
        - issued_token_type
        - token_type
        - expires_in
        - user_uuid
        - name
        - email
      properties:
        access_token:
          type: string
          description: Opaque platform session token; use as a bearer credential.
        issued_token_type:
          type: string
          const: 'urn:ietf:params:oauth:token-type:access_token'
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        user_uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
    TokenExchangeError:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          enum:
            - unsupported_grant_type
            - invalid_request
            - invalid_grant
            - invalid_target
        error_description: { type: string }
    JsonWebKey:
      type: object
      description: >-
        One RSA public signing key. Served by the partner, never by this API;
        the SDK builds this document from the generated federation keypair.
      required: [kty, use, alg, kid, n, e]
      properties:
        kty: { type: string, const: RSA }
        use: { type: string, const: sig }
        alg: { type: string, const: RS256 }
        kid:
          type: string
          description: RFC 7638 JWK thumbprint, so the id is stable per key.
        n: { type: string, description: 'RSA modulus, base64url.' }
        e: { type: string, description: 'RSA public exponent, base64url.' }
    JsonWebKeySet:
      type: object
      description: >-
        The document a partner serves at <issuer>/.well-known/jwks.json, which
        the platform fetches from the provider row's jwks_url.
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: '#/components/schemas/JsonWebKey' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
